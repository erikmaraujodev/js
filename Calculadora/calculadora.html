<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora com Tailwnd CSS</title>
    <!-- incluir biblioteca cdn Taildwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-gray-800 min-h-screen flex justify-center items-center">
    <!-- inicio calculadora -->
    <div class="w-85 p-4 bg-gray-700 rounded-lg shadow-lg">
      <!-- display -->
      <div class="w-full bg-gray-800 text-white text-right text-4x1 p-4">0</div>
      <!-- Botoes -->
      <div class="w-full flex gap-4 py-3">
        <!-- linha 1 -->
        <button
          id="botaoPorcento"
          value="%"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          %
        </button>
        <button
          id="botaoC"
          value="C"
          class="w-2/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          C
        </button>
        <button
          id="botaoBackspace"
          value="Backspace"
          class="w-1/4 bg-gray-950 text-white rounded hover:bg-gray-500 py-3"
        >
          <i class="bi bi-backspace"></i>
        </button>
      </div>
      <!-- linha 2 -->
      <div class="w-full flex gap-4 py-4">
        <button
          id="botao7"
          value="7"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          7
        </button>
        <button
          id="botao8"
          value="8"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          8
        </button>
        <button
          id="botao9"
          value="9"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          9
        </button>
        <button
          id="botaoMultiplicar"
          value="*"
          class="w-1/4 bg-gray-950 text-white rounded hover:bg-gray-500 py-3"
        >
          X
        </button>
      </div>
      <!-- linha 3 -->
      <div class="w-full flex gap-4 py-4">
        <button
          id="botao4"
          value="4"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          4
        </button>
        <button
          id="botao5"
          value="5"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          5
        </button>
        <button
          id="botao6"
          value="6"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          6
        </button>
        <button
          id="botaoSubtrair"
          value="-"
          class="w-1/4 bg-gray-950 text-white rounded hover:bg-gray-500 py-3"
        >
          -
        </button>
      </div>
      <!-- linha 4 -->
      <div class="w-full flex gap-4 py-4">
        <button
          id="botao1"
          value="1"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          1
        </button>
        <button
          id="botao2"
          value="2"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          2
        </button>
        <button
          id="botao3"
          value="3"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          3
        </button>
        <button
          id="botaoSomar"
          value="+"
          class="w-1/4 bg-gray-950 text-white rounded hover:bg-gray-500 py-3"
        >
          +
        </button>
      </div>
      <!-- linha 5 -->
      <div class="w-full flex gap-4 py-4">
        <button
          id="botaoMaisMenos"
          value="+/-"
          class="w-1/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          +/-
        </button>
        <button
          id="botao0"
          value="0"
          class="w-2/4 bg-gray-600 text-white rounded hover:bg-gray-500 py-3"
        >
          0
        </button>
        <button
          id="botaoVirgula"
          value=","
          class="w-1/4 bg-gray-950 text-white rounded hover:bg-gray-500 py-3"
        >
          ,
        </button>
      </div>
      <div class="w-full flex gap-4 py-4">
        <button
          id="botaoIgual"
          value="="
          class="w-4/4 bg-gray-950 text-white rounded hover:bg-gray-500 py-3"
        >
          =
        </button>
      </div>
    </div>
    <script src="script.js" type=""></script>
  </body>
</html>
